[global]
disable = [
  "MD013", # Line length
  "MD033", # Inline HTML
]
respect_gitignore = true
exclude = [".git", ".github", ".vale", "coverage", "dist", "node_modules", "tmp"]

[MD003]
style = "atx"

[MD004]
style = "dash"

[MD025]
front_matter_title = ""

[MD046]
style = "fenced"

[MD048]
style = "backtick"
